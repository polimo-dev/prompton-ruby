AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "test/conformance/**/*"

Layout/LineLength:
  Max: 120

Metrics:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Naming/PredicateMethod:
  Enabled: false

# HTTP status codes read better as test_a_429_… than as test_a429_….
Naming/VariableNumber:
  Enabled: false

Style/OpenStructUse:
  Enabled: false

# A named splat (**options) documents a public API better than an anonymous **, which is all
# TargetRubyVersion 3.2 makes newly available here.
Style/ArgumentsForwarding:
  UseAnonymousForwarding: false
